name: admin_staff
description: "نظام تدبير قاعدة بيانات موظفي مصلحة إدارية ولائية — Offline-first, Arabic/French, Dark UI."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # ---- State management / DI (MIT) ----
  flutter_riverpod: ^3.4.3

  # ---- Navigation (BSD-3-Clause) ----
  go_router: ^18.0.2

  # ---- Local database: SQLite (BSD-3-Clause) ----
  sqflite: ^2.4.4
  sqflite_common_ffi: ^2.4.3

  # ---- Storage paths (BSD-3-Clause) ----
  path_provider: ^2.1.6

  # ---- Localization & formatting (MIT) ----
  intl: ^0.20.3

  # ---- Security (Apache-2.0 / BSD-3-Clause) ----
  # flutter_secure_storage محذوف: مفاتيحه كلها مخزَّنة في قاعدة SQLite
  # (المصطلحات/الإعدادات) ونسخها المشفَّرة، ولم يُستعمل في الكود إطلاقاً.
  # إضافة تطبيقه على Windows تطلب مكوّن ATL في Visual Studio (خطوة مدير).
  local_auth: ^3.0.2
  cryptography: ^2.9.0

  # ---- Local notifications (Apache-2.0) ----
  # مؤقتاً خارج البناء: تطبيقها على Windows يتطلب مكوّن ATL في
  # Visual Studio (خطوة مدير)، ولم نستعملها في الكود بعد.
  # تعود في مرحلة الإشعارات: flutter_local_notifications: ^22.3.1

  # ---- Files & sharing (MIT / BSD-3-Clause) ----
  file_picker: ^13.1.0
  share_plus: ^13.3.1

  # ---- CSV parsing/writing (MIT) ----
  csv: ^8.0.0

  # ---- Checksums (BSD-3-Clause) ----
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0

# ---- Localization generation ----
flutter:
  uses-material-design: true

  generate: true
